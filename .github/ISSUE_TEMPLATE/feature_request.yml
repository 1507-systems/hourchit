name: Feature request
description: Suggest something the tool should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        hourchit is deliberately small — built for a business of one. Requests
        that add scope (multi-user accounts, roles, an approvals workflow) are
        likely to be declined, not because they're bad but because they belong
        in a different tool. `CONTRIBUTING.md` lists what's already planned.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that's awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true

  - type: dropdown
    id: shape
    attributes:
      label: Could this be a profile setting?
      description: >
        The core never mentions a specific client, so per-business behaviour
        usually belongs in the tenant profile rather than in code.
      options:
        - "Yes — it's per-business configuration"
        - "No — it's a change to how the app works for everyone"
        - "Not sure"
    validations:
      required: true
