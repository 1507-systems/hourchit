name: Drift guard

# A merge that doesn't ship is a silent failure: the code looks done and the
# running Worker disagrees. This asks each live deployment what it is running and
# compares that against this repository's history, so a missed deploy surfaces on
# its own instead of the next time someone tries to use the app.
#
# Runs GitHub-hosted because this repository is public: free, sandboxed, and a
# self-hosted runner must never be attached to a public repo. Scheduled runs only
# ever execute on the base repository, so HEALTH_URLS is not exposed to forks.
on:
  schedule:
    # 07:20 UTC daily. Off the hour — scheduled jobs at :00 queue behind the
    # whole platform's cron peak.
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-guard
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # Full history: the check is "is the deployed commit an ancestor of main",
      # which a shallow clone cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe /health of every configured deployment
        env:
          # Whitespace- or newline-separated list of deployment base URLs.
          # A repository secret rather than a file: a managed deployment's
          # hostname identifies the client, and this repository is public.
          HEALTH_URLS: ${{ secrets.HEALTH_URLS }}
        run: |
          set -uo pipefail

          # tr, not ${//}, so a value of just newlines counts as empty too.
          if [ -z "$(tr -d '[:space:]' <<<"$HEALTH_URLS")" ]; then
            echo "HEALTH_URLS is not set — no deployments to check."
            echo "Set it to enable this guard: a whitespace-separated list of" \
                 "deployment base URLs (https://<worker>.workers.dev)."
            echo "### Drift guard: inert — HEALTH_URLS is not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          main_sha="$(git rev-parse HEAD)"
          failed=0
          : > /tmp/rows

          row() { printf '| `%s` | %s | %s | %s | %s | %s |\n' "$@" >> /tmp/rows; }

          for base in $HEALTH_URLS; do
            base="${base%/}"
            echo "==> $base/health"

            body="$(curl -fsS --max-time 20 --retry 2 --retry-delay 5 "$base/health")" || {
              echo "::error::$base is unreachable. Either it was never deployed or it is down."
              row "$base" "unreachable" "—" "—" "—" "—"
              failed=1
              continue
            }

            status="$(jq -r '.status // ""' <<<"$body")"
            tenant="$(jq -r '.tenant // ""' <<<"$body")"
            version="$(jq -r '.version // ""' <<<"$body")"
            config="$(jq -r '.config // ""' <<<"$body")"
            configured="$(jq -r '.configured // false' <<<"$body")"

            if [ "$status" != "ok" ]; then
              echo "::error::$base reported status '$status'."
              row "$base" "${tenant:-?}" "bad status" "—" "—" "$configured"
              failed=1
              continue
            fi

            # The app fails closed without ACCESS_TOKEN, so it would be serving
            # 503 to every real request while still answering here.
            if [ "$configured" != "true" ]; then
              echo "::error::$base is missing ACCESS_TOKEN — every route returns 503. Run: wrangler secret put ACCESS_TOKEN"
              failed=1
            fi

            if [ -z "$version" ] || [ "$version" = "unknown" ]; then
              echo "::error::$base does not report a build identity ('$version'). It predates build stamping, or was deployed from a tree with no git history — either way the deploy cannot be verified."
              row "$base" "$tenant" "unstamped" "—" "${config:-—}" "$configured"
              failed=1
              continue
            fi

            # A deployed commit that is not in this history is not reviewed code.
            if ! git cat-file -e "${version}^{commit}" 2>/dev/null; then
              echo "::error::$base is running core commit $version, which does not exist in this repository. It was deployed from a fork or an unpushed branch."
              row "$base" "$tenant" "$version (unknown)" "—" "${config:-—}" "$configured"
              failed=1
              continue
            fi

            if git merge-base --is-ancestor "$version" "$main_sha"; then
              behind="$(git rev-list --count "$version..$main_sha")"
              if [ "$behind" -eq 0 ]; then
                echo "  up to date at $version"
              else
                # Not an error: a managed tenant deliberately pins the core, so
                # trailing main is the normal state between config bumps. It is
                # still worth seeing, because "pinned" and "forgotten" look alike.
                echo "::warning::$base ($tenant) runs core $version, $behind commit(s) behind main. Bump its pinned core ref to ship them."
              fi
            else
              echo "::warning::$base ($tenant) runs core $version, which is not an ancestor of main — a branch deploy, or main was force-pushed."
              behind="?"
            fi

            row "$base" "$tenant" "$version" "$behind" "${config:-—}" "$configured"
          done

          {
            echo "### Drift guard"
            echo
            echo "main is \`$main_sha\`"
            echo
            echo "| deployment | tenant | core | behind main | config | ACCESS_TOKEN |"
            echo "|---|---|---|---|---|---|"
            cat /tmp/rows 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"
