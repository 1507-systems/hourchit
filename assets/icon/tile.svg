<!--
  HourChit app-icon tile: the punched-tag mark (see mark.svg) centered on the
  ink brand square, at the size Apple/Google expect a flat, non-rounded,
  non-transparent square icon to arrive in (they apply the corner mask
  themselves at render time).

  Regenerate every exported PNG from this file with rsvg-convert, e.g.:
    rsvg-convert -w 1024 -h 1024 assets/icon/tile.svg -o assets/icon/ios/icon-1024.png
    rsvg-convert -w 32   -h 32   assets/icon/tile.svg -o assets/icon/favicon/favicon-32.png
  Verify pixel size afterwards, don't just trust the command exited 0:
    sips -g pixelWidth -g pixelHeight -g hasAlpha assets/icon/ios/icon-1024.png
  Exported sizes as of 2026-08-03: iOS 1024/180/120/87/80/60/58/40/29,
  Android standard 512, favicon 32/48 -- all opaque (no alpha channel; verify
  with sips -g hasAlpha, rsvg-convert only omits alpha when the whole canvas
  is covered by an opaque shape, which this file's background rect does).
-->
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="1000" fill="#15181E"/>
  <!-- Mark scaled so it fills ~77.5% of tile height (mid of the 75-80% spec
       range), centered both axes. Geometry inside the g element is the
       verbatim mark from the approved mockup, untouched; only the wrapping
       transform changes its position/size. -->
  <g transform="translate(197.265625,112.5) scale(6.0546875)">
    <defs>
      <mask id="hole">
        <rect width="100" height="128" fill="#fff"/>
        <circle cx="50" cy="42" r="13" fill="#000"/>
      </mask>
    </defs>
    <path d="M30 4 H92 a4 4 0 0 1 4 4 V120 a4 4 0 0 1 -4 4 H8 a4 4 0 0 1 -4 -4 V30 Z"
          fill="#E8952A" mask="url(#hole)"/>
    <rect x="22" y="76" width="56" height="6" rx="3" fill="#15181E" opacity="0.30"/>
    <rect x="22" y="94" width="38" height="6" rx="3" fill="#15181E" opacity="0.30"/>
  </g>
</svg>
